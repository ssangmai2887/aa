<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>강남 예약</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    }

    .container {
      max-width: 100%;
      width: 100%;
      margin: 0 auto;
    }

    .call-link {
      display: block;
      width: 100%;
      text-decoration: none;
    }

    .call-link img {
      display: block;
      width: 100%;
      height: auto;
      border: none;
    }

    /* 모바일에서 터치 반응 */
    .call-link:active {
      opacity: 0.95;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 이미지 전체를 클릭하면 전화 연결 -->
    <a href="tel:01080372853" class="call-link">
      <img src="강남.png" alt="강남 가라오케 예약 전화 연결 010-8037-2853">
    </a>
  </div>
</body>
</html>
